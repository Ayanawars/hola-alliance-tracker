.toolbar{display:grid;grid-template-columns:1fr 180px;gap:12px;margin-bottom:14px}
.search,.filter{height:48px;border-radius:13px;border:1px solid var(--line);background:#101d2c;color:var(--text);font:inherit;padding:0 14px;outline:none}

 const rank=document.getElementById("filter").value;

 const defs=[

 const s=m.survey||{};
 const img=avatar(m), squads=[1,2,3].map(i=>({type:s[`squad${i}_type`]||s[`squad${i}Type`]||"",power:s[`squad${i}_power`]||s[`squad${i}Power`]||""}));
 document.getElementById("profile").innerHTML=`<div class="profile-head"><span class="avatar">${img?`<img src="${esc(img)}" alt="">`:"👤"}</span><div><h2>${esc(m.name)} ${flag(m)?esc(flag(m)):""}</h2><p><span class="rank ${m.rank.toLowerCase()}">${m.rank}</span> ${surveyDone(m)?"<span class='check' style='margin-left:8px'>✓</span> Encuesta completada":"Sin encuesta"}</p></div></div>
 <div class="profile-grid"><div class="info-card"><span>THP</span><b>${esc(fmtPower(getSurveyPower(m)))}</b></div><div class="info-card"><span>HQ</span><b>HQ ${esc(m.hq)}</b></div><div class="info-card"><span>T10</span><b>${s.t10===true?"Sí":s.t10===false?"No":"—"}</b></div><div class="info-card"><span>PROFESIÓN</span><b>${esc(s.profession||"—")}</b></div></div>
 <div class="squad-title">SQUADS</div>${squads.map((q,i)=>`<div class="squad-row"><strong>SQUAD ${i+1}</strong><span>${esc(q.type||"—")}</span><strong>${esc(fmtPower(q.power||"—"))}</strong></div>`).join("")}`;
 document.getElementById("modal").classList.add("show");
}

document.getElementById("close").onclick=()=>document.getElementById("modal").classList.remove("show");
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")e.currentTarget.classList.remove("show")});
document.getElementById("search").addEventListener("input",render);document.getElementById("filter").addEventListener("change",render);

async function load(){
 try{
  const {data,error}=await supabase.from("players").select("*");
  if(error)throw error;
  const map=new Map((data||[]).filter(x=>x.name).map(x=>[norm(x.name),x]));
  members=baseRoster.map(m=>({...m,survey:map.get(norm(m.name))||null}));
  // Jugadores que hayan rellenado la encuesta pero no estén en la lista base.
  (data||[]).forEach(s=>{if(s.name&&!members.some(m=>norm(m.name)===norm(s.name)))members.push({rank:s.rank||"R1",name:s.name,thp:s.thp||"—",hq:s.hq||"—",survey:s})});
  statusEl.style.display="none";updateSummary();render();
 }catch(err){console.error(err);statusEl.textContent="No se pudieron cargar los datos de Supabase.";statusEl.style.display="block";updateSummary();render();}
}
load();
</script>
</body></html>
