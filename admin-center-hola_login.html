<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HOLa — Administración</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#011A27;color:#fff}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-wrap{width:min(430px,100%)}
.card{background:#063852;border:1px solid rgba(230,223,68,.35);border-radius:20px;padding:28px;box-shadow:0 18px 55px rgba(0,0,0,.42)}
.brand{text-align:center;margin-bottom:24px}
.brand img{display:block;width:min(300px,90%);height:auto;max-height:150px;object-fit:contain;margin:0 auto 10px}
.logo-text{font-size:64px;font-weight:900;letter-spacing:4px;color:#F0810F;text-shadow:0 0 18px rgba(240,129,15,.4)}
.subtitle{font-size:13px;letter-spacing:2px;color:#E6DF44;text-transform:uppercase}
h1{font-size:22px;text-align:center;margin:0 0 22px;font-weight:700}
label{display:block;font-size:13px;margin:0 0 7px;color:#dce9ee}
input{width:100%;height:48px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:#011A27;color:#fff;padding:0 14px;font-size:15px;outline:none;margin-bottom:16px}
input:focus{border-color:#F0810F;box-shadow:0 0 0 3px rgba(240,129,15,.12)}
button{width:100%;height:48px;border:0;border-radius:10px;background:#F0810F;color:#011A27;font-size:15px;font-weight:800;cursor:pointer}
button:hover{filter:brightness(1.08)}
button:disabled{opacity:.6;cursor:not-allowed}
.message{display:none;margin-top:16px;padding:11px 12px;border-radius:9px;font-size:13px;line-height:1.4}
.message.error{display:block;background:rgba(220,50,50,.14);border:1px solid rgba(255,90,90,.35);color:#ffd2d2}
.message.ok{display:block;background:rgba(60,190,120,.14);border:1px solid rgba(60,190,120,.35);color:#d4ffe5}
.hint{text-align:center;color:#a9c0c9;font-size:12px;margin-top:18px;line-height:1.5}
.panel{display:none;width:min(1000px,100%);padding:20px}
.panel.active{display:block}
.panel-card{background:#063852;border:1px solid rgba(230,223,68,.3);border-radius:18px;padding:24px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:22px}
.panel-head h2{margin:0;color:#E6DF44}
.logout{width:auto;padding:0 18px;background:#011A27;color:#fff;border:1px solid rgba(255,255,255,.2)}
.modules{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.module{padding:18px;border-radius:12px;background:#011A27;border:1px solid rgba(255,255,255,.08);font-size:14px}
.module b{display:block;margin-top:7px;color:#E6DF44}
@media(max-width:520px){.card{padding:22px 18px}body{padding:12px}}
</style>
</head>

      <div class="subtitle">Centro de Administración</div>

    <h1>Iniciar sesión</h1>

    <form id="loginForm">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" required placeholder="admin@ejemplo.com">

      <label for="password">Contraseña</label>
      <input id="password" type="password" autocomplete="current-password" required placeholder="••••••••">

      <button id="loginBtn" type="submit">INICIAR SESIÓN</button>
    </form>

    <div id="message" class="message"></div>
    <div class="hint">Acceso restringido a administradores autorizados.</div>
  </div>
</div>

<div class="panel" id="adminPanel">
  <div class="panel-card">
    <div class="panel-head">
      <div>
        <h2>HOLa — Administración</h2>
        <small id="adminEmail"></small>
      </div>
      <button class="logout" id="logoutBtn">Cerrar sesión</button>
    </div>

    <div class="modules">
      <div class="module">👥<b>Jugadores</b></div>
      <div class="module">⚔️<b>Desert Storm</b></div>
      <div class="module">🏆<b>VS</b></div>
      <div class="module">🚂<b>Tren</b></div>
      <div class="module">🎁<b>Donaciones</b></div>
      <div class="module">📢<b>Avisos</b></div>
      <div class="module">📚<b>Guías</b></div>
      <div class="module">⚙️<b>Configuración</b></div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://ovybstpiomphrouvqxmf.supabase.co";
const SUPABASE_KEY = "sb_publishable_gU5Wgy2NhdXcy23_TotF9g_LKthVmKV";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const loginScreen = document.getElementById("loginScreen");
const adminPanel = document.getElementById("adminPanel");
const loginForm = document.getElementById("loginForm");
const loginBtn = document.getElementById("loginBtn");
const message = document.getElementById("message");
const adminEmail = document.getElementById("adminEmail");

function showMessage(text, type="error"){
  message.textContent = text;
  message.className = "message " + type;
}

async function checkAdmin(user){
  if(!user) return false;

  const { data, error } = await supabaseClient
    .from("admin_users")
    .select("user_id,display_name")
    .eq("user_id", user.id)
    .maybeSingle();

  if(error){
    console.error(error);
    throw new Error("No se pudo comprobar la autorización.");
  }

  return !!data;
}

async function showCurrentSession(){
  const { data } = await supabaseClient.auth.getSession();
  const user = data?.session?.user;

  if(!user){
    loginScreen.style.display = "block";
    adminPanel.classList.remove("active");
    return;
  }

  try{
    const authorized = await checkAdmin(user);
    if(!authorized){
      await supabaseClient.auth.signOut();
      loginScreen.style.display = "block";
      adminPanel.classList.remove("active");
      showMessage("Esta cuenta no está autorizada para acceder al panel.");
      return;
    }

    loginScreen.style.display = "none";
    adminPanel.classList.add("active");
    adminEmail.textContent = user.email || "";
  }catch(err){
    await supabaseClient.auth.signOut();
    loginScreen.style.display = "block";
    adminPanel.classList.remove("active");
    showMessage(err.message || "Error de autorización.");
  }
}

loginForm.addEventListener("submit", async (e)=>{
  e.preventDefault();
  loginBtn.disabled = true;
  loginBtn.textContent = "ENTRANDO...";
  message.className = "message";

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

  if(error){
    showMessage("Email o contraseña incorrectos.");
    loginBtn.disabled = false;
    loginBtn.textContent = "INICIAR SESIÓN";
    return;
  }

  await showCurrentSession();
  loginBtn.disabled = false;
  loginBtn.textContent = "INICIAR SESIÓN";
});

document.getElementById("logoutBtn").addEventListener("click", async ()=>{
  await supabaseClient.auth.signOut();
  adminPanel.classList.remove("active");
  loginScreen.style.display = "block";
  loginForm.reset();
  message.className = "message";
});

supabaseClient.auth.onAuthStateChange(async (_event, session)=>{
  if(session?.user) await showCurrentSession();
});

showCurrentSession();
</script>
